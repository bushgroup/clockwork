[project]
name = "clockwork"
version = "0.1.0"
description = "Control software for SLIMPHONY-style ion mobility mass spectrometers: MIPS pulse sequences, SA220P acquisition, UIMF output."
readme = "README.md"
requires-python = "==3.12.*"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy~=2.5.2",
    # The UIMF writer and reader both live in mainspring, so that the code which
    # creates a file and the code which reads one are the same code (lab record,
    # task 06). It reaches PyPI never -- the wheel is a GitHub release asset --
    # so the source below is how a clone resolves it, and uv.lock pins the exact
    # commit. It becomes a tag at mainspring's next release.
    #
    # `[fast]` is numba, and it is not an optimisation to have later. Without it
    # mainspring decodes a frame's five thousand blobs in a Python loop that holds
    # the interpreter throughout, so the fold of one method frame costs about 1.5
    # seconds per repetition against the 1 second a repetition itself now costs:
    # the folding thread never catches up, and everything on the acquisition
    # thread beside it -- a serial round trip, a row count -- takes ten times as
    # long. With it the same fold is fifteen times quicker and the contention is
    # gone (lab record, task 34).
    "mainspring[fast]~=1.0",
    "pyserial~=3.5",
    "pyzmq~=27.2",
    "protobuf~=7.36",
    "python-snappy~=0.7.3",
    "PySide6~=6.11.2",
    "pyqtgraph~=0.14.0",
    "tomli-w~=1.2.0",
]

[project.scripts]
clockwork = "clockwork.app:main"

[project.urls]
Repository = "https://github.com/bushgroup/clockwork"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clockwork"]

[tool.uv]
package = true

[tool.uv.sources]
mainspring = { git = "https://github.com/bushgroup/mainspring", branch = "main" }

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-qt~=4.5",
    "ruff~=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
